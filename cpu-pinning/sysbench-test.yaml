apiVersion: v1
kind: Pod
metadata:
  name: floating-benchmark
spec:
  containers:
  - name: sysbench
    image: ubuntu:latest
    # Install sysbench and sleep for 1 hour
    command: ["/bin/bash", "-c"]
    args: ["apt-get update && apt-get install -y sysbench && sleep 3600"]
    resources:
      requests:
        cpu: "200m"  # Fractional = Shared Pool
      limits:
        cpu: "500m"
---
apiVersion: v1
kind: Pod
metadata:
  name: pinned-benchmark
spec:
  containers:
  - name: sysbench
    image: ubuntu:latest
    command: ["/bin/bash", "-c"]
    args: ["apt-get update && apt-get install -y sysbench && sleep 3600"]
    resources:
      requests:
        cpu: "1"
        memory: "256Mi"  # <--- MUST MATCH LIMIT
      limits:
        cpu: "1"
        memory: "256Mi"  # <--- MUST MATCH REQUEST
